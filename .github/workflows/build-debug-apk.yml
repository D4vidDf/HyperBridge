name: Build Debug APK

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperBridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Add Job Summary
        run: |
          echo "## 📱 Debug APK Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "You can download the APK using the links below:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **[Download via GitHub Actions Artifact](${{ steps.upload-artifact.outputs.artifact-url }})**" >> $GITHUB_STEP_SUMMARY
          echo "- **[Direct 1-Click Download via nightly.link](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/HyperBridge-debug-apk.zip)** *(no login required)*" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 *Note: GitHub Actions artifacts are packaged into a \`.zip\` file by GitHub. Extract the archive to install \`app-debug.apk\`.*" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR with Download Links
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = '${{ steps.upload-artifact.outputs.artifact-url }}';
            const runId = '${{ github.run_id }}';
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const issue_number = context.issue.number;
            const nightlyLink = `https://nightly.link/${owner}/${repo}/actions/runs/${runId}/HyperBridge-debug-apk.zip`;
            const commitSha = context.sha.substring(0, 7);

            const body = `### 📱 Debug APK Ready for Testing

            The debug APK for commit \`${commitSha}\` has been built and is ready:

            * 📥 **[Download Debug APK (GitHub Actions Artifact)](${artifactUrl})**
            * ⚡ **[Direct 1-Click Download (nightly.link)](${nightlyLink})** *(no login required)*

            > 📦 **Android Installation Note**: GitHub Actions artifacts are downloaded as a \`.zip\` archive. Extract the zip to access and install \`app-debug.apk\`.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });
            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('Debug APK Ready for Testing')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Update Pre-release Debug APK (master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Latest Debug Build"
          body: "Automated debug APK build from the latest `master` branch commit."
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
